<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Spadające kafelki</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kafelki">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
:root{
  /* Układ: cały ekran to ściana z kafli (plansza). Ustawienia siedzą na tabliczce
     przy dolnej krawędzi (pion) albo przy prawej (poziom), żeby ściana była zawsze widoczna. */
  --wall-l:#e9eef1;--grout-l:#c2cdd5;   /* jasna ściana i jej fuga */
  --wall-d:#131b2e;--grout-d:#080c17;   /* ciemna ściana i jej fuga */
  --wall:var(--wall-l);     /* szkliwo ściany */
  --grout:var(--grout-l);    /* fuga */
  --panel:#fbfcfd;    /* tabliczka */
  --ink:#131d35;      /* tekst */
  --muted:#56637b;    /* tekst pomocniczy */
  --glaze:#1e44c8;    /* kobalt: akcent tabliczki i domyślny kolor kafelków */
  --danger:#dc3a21;   /* cynober: pudło */
  --on-glaze:#ffffff;
  --display:"Big Shoulders","Big Shoulders Display","Avenir Next Condensed","Roboto Condensed","Arial Narrow",sans-serif-condensed,Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --gloss:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 46%,rgba(0,0,0,.2));
  --bevel:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -3px 0 rgba(0,0,0,.22);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --wall:var(--wall-d);--grout:var(--grout-d);--panel:#1b2540;--ink:#e9eefb;--muted:#9aa6c2;--glaze:#4f72ff;--danger:#f2553a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --wall:var(--wall-d);--grout:var(--grout-d);--panel:#1b2540;--ink:#e9eefb;--muted:#9aa6c2;--glaze:#4f72ff;--danger:#f2553a;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--wall);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.4;
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
[hidden]{display:none !important}

#app{position:relative;height:100%;overflow:hidden;background:var(--board);--board:var(--wall);--board-grout:var(--grout)}
/* kolor kafelków może wymusić jaśniejszą albo ciemniejszą ścianę niż motyw strony */
#app[data-board="light"]{--board:var(--wall-l);--board-grout:var(--grout-l)}
#app[data-board="dark"]{--board:var(--wall-d);--board-grout:var(--grout-d)}
#field{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- wynik i pauza w trakcie gry ---------- */
.hud{position:absolute;inset:0;padding:12px 16px;display:none;justify-content:space-between;align-items:flex-start;pointer-events:none}
#app:not([data-state="menu"]) .hud{display:flex}
.plaque{background:var(--panel);border:2px solid var(--grout);border-radius:10px;box-shadow:0 4px 14px rgba(9,15,32,.16)}
.scorebox{display:flex;align-items:center;gap:12px;height:48px;padding:0 12px}
#score{font-family:var(--display);font-weight:900;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.lives{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.life{width:11px;height:16px;border-radius:3px;background:var(--gloss),var(--glaze)}
.life.lost{background:none;box-shadow:inset 0 0 0 2px var(--grout)}
#pauseBtn{pointer-events:auto;width:48px;height:48px;padding:0;display:grid;place-items:center;cursor:pointer}

/* ---------- tabliczka z ustawieniami ---------- */
.overlay{
  position:absolute;inset:0;padding:16px;display:flex;align-items:flex-end;justify-content:center;
  visibility:hidden;opacity:0;transition:opacity .18s ease,visibility 0s linear .18s;
}
.overlay::before{content:"";position:absolute;inset:0;background:var(--board);opacity:.32}
.overlay.show{visibility:visible;opacity:1;transition:opacity .18s ease}
.panel{
  position:relative;width:min(100%,480px);max-height:100%;
  display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"head" "settings" "actions";
  background:var(--panel);border:2px solid var(--grout);border-radius:14px;
  box-shadow:0 14px 40px rgba(9,15,32,.22);
}
.head{grid-area:head;padding:20px 20px 0;min-width:0}
.settings{
  grid-area:settings;min-height:0;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  padding:18px 20px 6px;display:flex;flex-direction:column;gap:18px;
}
.actions{grid-area:actions;padding:14px 20px 20px;display:flex;flex-wrap:wrap;gap:10px}

@media (orientation:landscape) and (min-width:640px){
  .overlay{align-items:center;justify-content:flex-end}
  .panel{
    width:min(100%,600px);
    grid-template-columns:minmax(0,5fr) minmax(0,6fr);grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"head settings" "actions settings";
  }
  .head{padding:20px 0 0 20px}
  .settings{padding:20px 20px 20px 24px}
  .actions{padding:14px 0 20px 20px}
}

/* tytuł z kafelków-liter */
.title{display:flex;gap:4px;margin:0;--tw:40px;--c:var(--glaze)}
.overlay[data-mode="over"] .title{--c:var(--danger)}
.title span{
  flex:none;width:var(--tw);height:calc(var(--tw)*1.22);display:grid;place-items:center;
  border-radius:calc(var(--tw)*.12);background:var(--gloss),var(--c);box-shadow:var(--bevel);
  color:var(--on-glaze);font-family:var(--display);font-weight:900;font-size:calc(var(--tw)*1.02);line-height:1;
  animation:drop .5s cubic-bezier(.2,.9,.25,1) backwards;animation-delay:calc(var(--i)*40ms);
}
.title .sp{width:calc(var(--tw)*.45);background:none;box-shadow:none;animation:none}
@keyframes drop{from{transform:translateY(-160%) rotate(-5deg)}70%{transform:translateY(5%)}to{transform:none}}

.sub{margin:12px 0 0;color:var(--muted);font-size:15px;line-height:1.4;max-width:38ch;text-wrap:pretty}
.note{margin:8px 0 0;font-size:15px;font-weight:600}
.stats{display:flex;align-items:flex-end;gap:22px;margin-top:12px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--display);font-weight:900;font-size:56px;line-height:.95;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
.stat.minor b{font-size:34px}

/* pola ustawień */
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.field-title{font-weight:600}
.field-val{flex:none;font-family:var(--display);font-weight:800;font-size:24px;line-height:1;color:var(--glaze);font-variant-numeric:tabular-nums;white-space:nowrap}
.field-val small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted)}

.slider-row{display:flex;align-items:center;gap:10px}
.step{
  flex:none;width:44px;height:44px;padding:0;border-radius:8px;border:2px solid var(--grout);background:var(--wall);
  font-family:var(--display);font-weight:800;font-size:28px;line-height:1;cursor:pointer;
}
input[type="range"]{-webkit-appearance:none;appearance:none;flex:1 1 0;min-width:0;height:44px;margin:0;background:transparent;cursor:pointer;--pct:0%}
input[type="range"]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--glaze) var(--pct),var(--grout) var(--pct))}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:32px;margin-top:-13px;border:0;border-radius:6px;background:var(--gloss),var(--glaze);box-shadow:var(--bevel),0 2px 6px rgba(9,15,32,.3)}
input[type="range"]::-moz-range-track{height:6px;border-radius:3px;background:var(--grout)}
input[type="range"]::-moz-range-progress{height:6px;border-radius:3px;background:var(--glaze)}
input[type="range"]::-moz-range-thumb{width:26px;height:32px;border:0;border-radius:6px;background:var(--gloss),var(--glaze);box-shadow:var(--bevel),0 2px 6px rgba(9,15,32,.3)}

.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:6px}
.chip{
  height:48px;padding:0;border-radius:8px;border:2px solid var(--grout);background:var(--wall);cursor:pointer;
  font-family:var(--display);font-weight:800;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;
}
.chip[aria-checked="true"]{border-color:transparent;color:var(--on-glaze);background:var(--gloss),var(--glaze);box-shadow:var(--bevel)}

.swatches{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.swatch{
  position:relative;height:44px;padding:0;border-radius:8px;border:2px solid var(--grout);cursor:pointer;
  background:var(--gloss),var(--sw);box-shadow:var(--bevel);
}
.swatch[aria-checked="true"]{border-color:var(--panel);box-shadow:var(--bevel),0 0 0 3px var(--ink)}
.swatch[aria-checked="true"]::after{
  content:"";position:absolute;left:50%;top:45%;width:8px;height:16px;
  border:solid var(--sw-on);border-width:0 3.5px 3.5px 0;transform:translate(-50%,-50%) rotate(45deg);
}

.more{border-top:2px solid var(--grout)}
.overlay[data-mode="pause"] .more{display:none}
.more summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font-weight:600;cursor:pointer}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"";width:9px;height:9px;margin-right:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-3px) rotate(45deg);transition:transform .15s}
.more[open] summary::after{transform:translateY(2px) rotate(-135deg)}
.more-body{display:flex;flex-direction:column;gap:18px;padding:6px 0 12px}

.switch-row{display:flex;justify-content:space-between;align-items:center;gap:16px;cursor:pointer}
.switch-row .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.switch-row .txt b{font-weight:600}
.switch-row .txt small{font-size:13px;line-height:1.35;color:var(--muted)}
.switch{-webkit-appearance:none;appearance:none;flex:none;position:relative;width:56px;height:32px;margin:0;border-radius:8px;background:var(--grout);cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:6px;background:var(--panel);box-shadow:0 1px 3px rgba(9,15,32,.3);transition:transform .15s}
.switch:checked{background:var(--glaze)}
.switch:checked::after{transform:translateX(24px)}

.btn{height:56px;padding:0;border:0;border-radius:10px;cursor:pointer;font-family:var(--display);font-weight:800;font-size:27px;line-height:1;letter-spacing:.01em}
.btn.primary{flex:1 1 0;min-width:0;color:var(--on-glaze);background:var(--gloss),var(--glaze);box-shadow:var(--bevel)}
.btn.primary:active{transform:translateY(2px)}
.btn.icon{flex:none;width:56px;display:grid;place-items:center;background:var(--wall);border:2px solid var(--grout)}
.btn.quiet{flex:1 1 100%;height:48px;font-size:21px;font-weight:700;background:none;border:2px solid var(--grout)}

@media (prefers-reduced-motion:reduce){
  .title span{animation:none}
  .overlay,.overlay.show,.switch,.switch::after,.more summary::after{transition:none}
}
</style>
</head>
<body>
<div id="app" data-state="menu">
  <canvas id="field"></canvas>

  <div class="hud" id="hud">
    <div class="plaque scorebox">
      <span id="score" aria-label="Wynik">0</span>
      <span id="lives" class="lives" role="img" aria-label="Życia"></span>
    </div>
    <button id="pauseBtn" class="plaque" type="button" aria-label="Pauza">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"></rect><rect x="14" y="4.5" width="4.5" height="15" rx="1.2" fill="currentColor"></rect></svg>
    </button>
  </div>

  <div id="overlay" class="overlay show" data-mode="start">
    <div class="panel" role="dialog" aria-labelledby="title">
      <header class="head">
        <h1 class="title" id="title"></h1>
        <p class="sub" id="sub"></p>
        <p class="note" id="bestNote" hidden></p>
        <div class="stats" id="stats" hidden>
          <div class="stat" id="statScore"><b id="ovScore">0</b><span>wynik</span></div>
          <div class="stat minor" id="statBest"><b id="ovBest">0</b><span>rekord</span></div>
          <div class="stat minor" id="statMiss"><b id="ovMiss">0</b><span>pudła</span></div>
        </div>
      </header>

      <section class="settings" id="settings" aria-label="Ustawienia">
        <div class="field">
          <div class="field-head">
            <label class="field-title" for="speed">Prędkość</label>
            <output class="field-val" id="speedOut" for="speed"></output>
          </div>
          <div class="slider-row">
            <button class="step" id="speedDown" type="button" aria-label="Wolniej">−</button>
            <input id="speed" type="range" min="1" max="5" step="0.2" value="2.4">
            <button class="step" id="speedUp" type="button" aria-label="Szybciej">+</button>
          </div>
        </div>

        <div class="field">
          <div class="field-head">
            <span class="field-title" id="perRowTitle">Kafelki na tej samej wysokości</span>
            <output class="field-val" id="perRowOut"></output>
          </div>
          <div class="chips" id="perRowChips" role="radiogroup" aria-labelledby="perRowTitle"></div>
        </div>

        <div class="field">
          <div class="field-head">
            <span class="field-title" id="colorTitle">Kolor kafelków</span>
            <output class="field-val" id="colorOut"></output>
          </div>
          <div class="swatches" id="colorSwatches" role="radiogroup" aria-labelledby="colorTitle"></div>
        </div>

        <details class="more" id="more">
          <summary id="moreSummary">Więcej ustawień</summary>
          <div class="more-body">
            <div class="field">
              <span class="field-title" id="colsTitle">Kolumny</span>
              <div class="chips" id="colsChips" role="radiogroup" aria-labelledby="colsTitle"></div>
            </div>
            <div class="field">
              <span class="field-title" id="livesTitle">Życia</span>
              <div class="chips" id="livesChips" role="radiogroup" aria-labelledby="livesTitle"></div>
            </div>
            <label class="switch-row" for="penalty">
              <span class="txt"><b>Puste kliknięcie zabiera życie</b><small>Dotyczy kliknięć w ścianę obok kafelka.</small></span>
              <input class="switch" id="penalty" type="checkbox" role="switch">
            </label>
            <label class="switch-row" for="exact">
              <span class="txt"><b>Zawsze pełna liczba kafelków</b><small>Po wyłączeniu w rzędzie spada losowo od 1 do wybranej liczby.</small></span>
              <input class="switch" id="exact" type="checkbox" role="switch">
            </label>
          </div>
        </details>
      </section>

      <div class="actions">
        <button class="btn primary" id="primaryBtn" type="button">Graj</button>
        <button class="btn icon" id="fsBtn" type="button" aria-label="Pełny ekran" hidden>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"></path></svg>
        </button>
        <button class="btn quiet" id="secondaryBtn" type="button" hidden>Do menu</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const $ = (s) => document.querySelector(s);
const root = document.documentElement;
const app = $('#app'), canvas = $('#field'), ctx = canvas.getContext('2d');
const overlay = $('#overlay'), titleEl = $('#title'), subEl = $('#sub'), noteEl = $('#bestNote'), statsEl = $('#stats');
const primaryBtn = $('#primaryBtn'), secondaryBtn = $('#secondaryBtn'), fsBtn = $('#fsBtn');
const scoreEl = $('#score'), livesEl = $('#lives'), pauseBtn = $('#pauseBtn');
const speedEl = $('#speed'), speedOut = $('#speedOut'), perRowOut = $('#perRowOut');

/* ---------- pamięć przeglądarki: tylko wygoda (ustawienia i rekord) ---------- */
const mem = {};
const store = {
  get(k) { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return k in mem ? mem[k] : null; },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
};

/* ---------- ustawienia ---------- */
const SPEED_MIN = 1, SPEED_MAX = 5, SPEED_DIV = 5;   // prędkość od 1 do 5, co 0,2
const COLS_MIN = 3, COLS_MAX = 8;
const LIVES = [1, 3, 5, 0];                       // 0 = bez limitu
// Kolor kafelka na jasnej (l) i na ciemnej (d) ścianie. Pole wall wymusza ton ściany, na którym ten kolor widać.
const COLORS = [
  { id: 'kobalt', name: 'Kobaltowy', l: '1e44c8', d: '4f72ff' },
  { id: 'blekit', name: 'Błękitny', l: '0b84d8', d: '3db4ff' },
  { id: 'turkus', name: 'Turkusowy', l: '08909a', d: '22dcd6' },
  { id: 'zielony', name: 'Zielony', l: '188f47', d: '3fd972' },
  { id: 'limonka', name: 'Limonkowy', l: '6f9e0e', d: 'b4e332' },
  { id: 'zolty', name: 'Żółty', l: 'ffd426', d: 'ffd426', wall: 'dark' },
  { id: 'pomarancz', name: 'Pomarańczowy', l: 'e56a0b', d: 'ff9233' },
  { id: 'malina', name: 'Malinowy', l: 'd11f58', d: 'ff4d84' },
  { id: 'roz', name: 'Różowy', l: 'd43fb0', d: 'ff7ad6' },
  { id: 'fiolet', name: 'Fioletowy', l: '7a3fe0', d: 'a67bff' },
  { id: 'czarny', name: 'Czarny', l: '14161b', d: '14161b', wall: 'light' },
  { id: 'bialy', name: 'Biały', l: 'f3f6f9', d: 'f3f6f9', wall: 'dark' }
];
const S = { speed: 2.4, perRow: 1, exact: false, cols: 4, lives: 3, penalty: true, color: 'kobalt' };

function clampSettings() {
  const sp = Number(S.speed);
  S.speed = Math.min(SPEED_MAX, Math.max(SPEED_MIN, Math.round((isFinite(sp) ? sp : 2.4) * SPEED_DIV) / SPEED_DIV));
  const c = Math.round(Number(S.cols));
  S.cols = Math.min(COLS_MAX, Math.max(COLS_MIN, isFinite(c) ? c : 4));
  const p = Math.round(Number(S.perRow));
  S.perRow = Math.min(S.cols, Math.max(1, isFinite(p) ? p : 1));
  S.lives = LIVES.includes(S.lives) ? S.lives : 3;
  S.exact = !!S.exact; S.penalty = !!S.penalty;
  S.color = COLORS.some((c) => c.id === S.color) ? S.color : COLORS[0].id;
}
function adopt(src) { if (src && typeof src === 'object') for (const k in S) if (k in src) S[k] = src[k]; clampSettings(); }
function loadSettings() { try { adopt(JSON.parse(store.get('kafelki.ustawienia') || 'null')); } catch (e) { clampSettings(); } }
function saveSettings() { store.set('kafelki.ustawienia', JSON.stringify(S)); }
const bestKey = () => 'kafelki.rekord.' + [S.speed, S.perRow, +S.exact, S.cols, S.lives, +S.penalty].join('-');
const getBest = () => Number(store.get(bestKey())) || 0;
const fmt = (n) => n.toFixed(1).replace('.', ',');

/* ---------- stan gry ---------- */
const ROWS = 4;               // tyle rzędów mieści się na wysokość ekranu
const SHARD_T = 0.42;         // czas życia odłamka (s)
const FLASH_T = 0.35;
const TAU = Math.PI * 2;
let W = 1, H = 1, colW = 1, rowH = 1;
let state = 'menu';           // menu | countdown | playing | paused | dying
let rows = [];                // od najniższego rzędu do najwyższego; y liczone w rzędach
let shards = [], flashes = [];
let scroll = 0;               // o ile rzędów zjechała ściana
let score = 0, lives = 0, misses = 0;
let countdown = 0, dying = 0, shake = 0, missGlow = 0;
let lastLoss = 'miss', lastResult = null;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function setState(s) { state = s; app.dataset.state = s; }

/* ---------- kolory: motyw strony i wybrany kolor kafelków ---------- */
const C = {}, K = {};
const WHITE = [255, 255, 255], BLACK = [0, 0, 0], DARK = [19, 29, 53], LIGHT = [233, 238, 251];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a) => 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a + ')';
function hex(s, fallback) {
  const m = /^#([0-9a-f]{6})$/i.exec(String(s || '').trim());
  const h = m ? m[1] : fallback;
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
const lin = (v) => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
const lum = (c) => 0.2126 * lin(c[0]) + 0.7152 * lin(c[1]) + 0.0722 * lin(c[2]);   // jasność względna 0..1
const palette = (c) => ({ hi: rgba(mix(c, WHITE, 0.26), 1), mid: rgba(c, 1), lo: rgba(mix(c, BLACK, 0.24), 1) });
const colorDef = () => COLORS.find((c) => c.id === S.color) || COLORS[0];
const tileRgb = (def, tone) => hex('#' + (tone === 'dark' ? def.d : def.l), '1e44c8');
let FONT = 'sans-serif';
let themeTone = 'light';      // ton ściany wynikający z motywu strony
function readTheme() {
  themeTone = lum(hex(getComputedStyle(root).getPropertyValue('--wall'), 'e9eef1')) < 0.2 ? 'dark' : 'light';
  const def = colorDef();
  const tone = def.wall || themeTone;            // czarne, białe i żółte kafelki same dobierają ścianę
  if (tone === themeTone) app.removeAttribute('data-board'); else app.dataset.board = tone;
  const cs = getComputedStyle(app);
  C.wall = hex(cs.getPropertyValue('--board'), tone === 'dark' ? '131b2e' : 'e9eef1');
  C.grout = hex(cs.getPropertyValue('--board-grout'), tone === 'dark' ? '080c17' : 'c2cdd5');
  C.danger = hex(cs.getPropertyValue('--danger'), 'dc3a21');
  C.glaze = tileRgb(def, tone);
  C.mark = tone === 'dark' ? LIGHT : DARK;       // odliczanie i błyski na ścianie
  K.grout = rgba(C.grout, 1); K.mark = rgba(C.mark, 1); K.halo = rgba(C.wall, 0.92);
  K.glaze = palette(C.glaze); K.bad = palette(C.danger);
  K.stamp = lum(C.glaze) > 0.36 ? rgba(DARK, 0.8) : 'rgba(255,255,255,0.88)';
  FONT = cs.getPropertyValue('--display').trim() || 'sans-serif';
}
function themeChanged() { readTheme(); renderControls(); }

/* ---------- wymiary ---------- */
function layout() {
  const r = app.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  const cw = Math.max(1, Math.round(W * dpr)), ch = Math.max(1, Math.round(H * dpr));
  if (canvas.width !== cw) canvas.width = cw;
  if (canvas.height !== ch) canvas.height = ch;
  colW = W / S.cols; rowH = H / ROWS;
  sizeTitle();
}
const groutW = () => Math.max(2, Math.min(5, Math.min(colW, rowH) * 0.035));
function tileBox(ry, col) {
  const g = groutW() / 2 + 0.5;
  return { x: col * colW + g, y: ry * rowH + g, w: colW - 2 * g, h: rowH - 2 * g };
}

/* ---------- rzędy kafelków ---------- */
function makeRow(y) {
  const n = S.exact ? S.perRow : 1 + Math.floor(Math.random() * S.perRow);
  const idx = Array.from({ length: S.cols }, (_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
  // st: 0 = spada, 1 = zbity, 2 = przepadł; m = wzór stempla
  return { y, tiles: idx.slice(0, n).map((col) => ({ col, st: 0, t: 0, m: Math.floor(Math.random() * 3) })) };
}
function resetField(prefill) {
  rows = []; shards = []; flashes = []; scroll = 0; shake = 0; missGlow = 0;
  if (prefill) for (let y = ROWS - 1; y >= -1; y--) rows.push(makeRow(y));
}

function advance(dt, live) {
  const dy = S.speed * dt;
  scroll += dy;
  for (const r of rows) r.y += dy;
  let top = rows.length ? rows[rows.length - 1].y : scroll - Math.floor(scroll);
  while (top > -1) { top -= 1; rows.push(makeRow(top)); }
  if (live) {
    for (const r of rows) {
      if (r.y + 1 < ROWS) break;                  // ten rząd i wszystkie wyższe jeszcze nie dotknęły dołu
      for (const t of r.tiles) {
        if (t.st !== 0) continue;
        t.st = 2; t.t = 0;
        missGlow = 1; shake = 1; lastLoss = 'miss';
        loseLife();
        if (state !== 'playing') return;
      }
    }
  }
  while (rows.length && rows[0].y >= ROWS) rows.shift();
}

function loseLife() {
  if (S.lives === 0) { misses++; return; }
  lives = Math.max(0, lives - 1);
  renderLives();
  if (lives === 0) { dying = 0; setState('dying'); }
}

/* ---------- kliknięcie ---------- */
function tap(px, py) {
  if (state !== 'playing') return;
  const col = Math.min(S.cols - 1, Math.max(0, Math.floor(px / colW)));
  const yr = py / rowH;
  // Kafelek ucieka spod palca, więc trafienie tuż nad nim też się liczy (tym hojniej, im szybciej spada).
  const up = 0.06 + 0.025 * S.speed, down = 0.03;
  let hitRow = null, hitTile = null, spent = false;
  for (const r of rows) {
    if (yr < r.y - up || yr > r.y + 1 + down) continue;
    for (const t of r.tiles) {
      if (t.col !== col) continue;
      if (t.st === 0) { hitRow = r; hitTile = t; } else spent = true;
    }
    if (hitTile) break;
  }
  if (hitTile) {
    hitTile.st = 1;
    score++; scoreEl.textContent = String(score);
    shatter(tileBox(hitRow.y, col), px, py);
    return;
  }
  if (spent) return;                               // kafelek już zbity albo właśnie przepadł: bez kary
  flashes.push({ k: Math.floor(yr - scroll), col, t: 0, bad: S.penalty });
  if (S.penalty) { shake = Math.max(shake, 0.7); lastLoss = 'tap'; loseLife(); }
}

/* Kafelek pęka w miejscu dotknięcia na osiem odłamków. */
function shatter(b, px, py) {
  const rnd = (a, z) => a + Math.random() * (z - a);
  const x = b.x, y = b.y, w = b.w, h = b.h, u = Math.min(w, h);
  const ix = Math.min(x + w * 0.8, Math.max(x + w * 0.2, px));
  const iy = Math.min(y + h * 0.8, Math.max(y + h * 0.2, py));
  const P = [[x, y], [x + w * rnd(0.3, 0.7), y], [x + w, y], [x + w, y + h * rnd(0.3, 0.7)],
             [x + w, y + h], [x + w * rnd(0.3, 0.7), y + h], [x, y + h], [x, y + h * rnd(0.3, 0.7)]];
  const fall = S.speed * rowH;
  for (let i = 0; i < 8; i++) {
    const a = P[i], c = P[(i + 1) % 8];
    const cx = (ix + a[0] + c[0]) / 3, cy = (iy + a[1] + c[1]) / 3;
    const dx = cx - ix, dy = cy - iy, d = Math.hypot(dx, dy) || 1;
    const sp = reduceMotion ? 0 : rnd(0.6, 1.3) * u * 2.4;
    shards.push({
      p: [ix - cx, iy - cy, a[0] - cx, a[1] - cy, c[0] - cx, c[1] - cy],
      x: cx, y: cy, vx: dx / d * sp, vy: dy / d * sp + (reduceMotion ? 0 : fall),
      rot: 0, vr: reduceMotion ? 0 : rnd(-5, 5), g: reduceMotion ? 0 : 1, t: 0,
      fill: rgba(mix(C.glaze, WHITE, rnd(0, 0.3)), 1)
    });
  }
}

/* ---------- krok animacji ---------- */
function fx(dt) {
  for (const r of rows) for (const t of r.tiles) if (t.st === 2) t.t += dt;
  const G = H * 2.6;
  for (let i = shards.length - 1; i >= 0; i--) {
    const s = shards[i];
    s.t += dt;
    if (s.t >= SHARD_T) { shards.splice(i, 1); continue; }
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += G * s.g * dt; s.rot += s.vr * dt;
  }
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].t += dt; if (flashes[i].t >= FLASH_T) flashes.splice(i, 1); }
  shake = Math.max(0, shake - dt * 3.2);
  missGlow = Math.max(0, missGlow - dt * 1.4);
}

function tick(dt) {
  if (state === 'paused') return;
  if (state === 'menu') advance(dt, false);
  else if (state === 'playing') advance(dt, true);
  else if (state === 'countdown') { countdown -= dt; if (countdown <= 0) setState('playing'); }
  else if (state === 'dying') { dying += dt; if (dying >= 0.9) { endGame(); return; } }
  fx(dt);
}

/* ---------- rysowanie ---------- */
function tilePath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

function drawStamp(cx, cy, u, m, color) {
  const dot = (x, y, r) => { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); };
  ctx.fillStyle = color; ctx.strokeStyle = color;
  ctx.beginPath();
  if (m === 3) {                                   // krzyżyk: kafelek przepadł
    const a = u * 0.16;
    ctx.moveTo(cx - a, cy - a); ctx.lineTo(cx + a, cy + a);
    ctx.moveTo(cx + a, cy - a); ctx.lineTo(cx - a, cy + a);
    ctx.lineWidth = u * 0.07; ctx.lineCap = 'round'; ctx.stroke();
    return;
  }
  if (m === 0) {                                   // rozeta: środek i osiem kropek
    dot(cx, cy, u * 0.07);
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8; dot(cx + Math.cos(a) * u * 0.21, cy + Math.sin(a) * u * 0.21, u * 0.04); }
  } else if (m === 1) {                            // cztery kropki i cztery punkciki
    dot(cx, cy, u * 0.05);
    for (let i = 0; i < 4; i++) { const a = i * TAU / 4; dot(cx + Math.cos(a) * u * 0.17, cy + Math.sin(a) * u * 0.17, u * 0.058); }
    for (let i = 0; i < 4; i++) { const a = TAU / 8 + i * TAU / 4; dot(cx + Math.cos(a) * u * 0.25, cy + Math.sin(a) * u * 0.25, u * 0.026); }
  } else {                                         // oczko: kropka w pierścieniu
    dot(cx, cy, u * 0.075);
    ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy, u * 0.19, 0, TAU);
    ctx.lineWidth = u * 0.045; ctx.stroke();
    return;
  }
  ctx.fill();
}

function drawGlazed(b, pal, m, stamp) {
  const x = b.x, y = b.y, w = b.w, h = b.h, u = Math.min(w, h);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, pal.hi); g.addColorStop(0.55, pal.mid); g.addColorStop(1, pal.lo);
  tilePath(x, y, w, h, u * 0.08);
  ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.13)';        // połysk od lewego górnego rogu
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * 0.7, y); ctx.lineTo(x, y + u * 0.7); ctx.closePath(); ctx.fill();
  const e = Math.max(1.5, u * 0.03);               // krawędzie szkliwa
  ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(x, y, w, e);
  ctx.fillStyle = 'rgba(0,0,0,0.24)'; ctx.fillRect(x, y + h - e * 1.4, w, e * 1.4);
  ctx.restore();
  drawStamp(x + w / 2, y + h / 2, u, m, stamp);
}

function drawCountdown() {
  const n = Math.max(1, Math.ceil(countdown));
  const f = n - countdown;                         // 0..1 w obrębie sekundy
  const size = Math.min(W, H) * 0.42 * (reduceMotion ? 1 : 1 + 0.18 * Math.max(0, 1 - f * 4));
  ctx.font = '900 ' + size + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.09; ctx.strokeStyle = K.halo;
  ctx.strokeText(String(n), W / 2, H / 2);
  ctx.fillStyle = K.mark; ctx.fillText(String(n), W / 2, H / 2);
}

function draw() {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0.02 && !reduceMotion) {
    const m = shake * Math.min(W, H) * 0.012;
    ctx.translate((Math.random() * 2 - 1) * m, (Math.random() * 2 - 1) * m);
  }

  // puste kliknięcia: kafel ściany błyska
  for (const f of flashes) {
    const a = 1 - f.t / FLASH_T;
    ctx.fillStyle = f.bad ? rgba(C.danger, 0.55 * a) : rgba(C.mark, 0.1 * a);
    ctx.fillRect(f.col * colW, (f.k + scroll) * rowH, colW, rowH);
  }

  // fugi: pionowe stoją, poziome jadą razem ze ścianą
  const gw = groutW();
  ctx.fillStyle = K.grout;
  for (let i = 1; i < S.cols; i++) ctx.fillRect(Math.round(i * colW - gw / 2), 0, gw, H);
  for (let k = Math.ceil(-scroll - 0.05); (k + scroll) * rowH < H + gw; k++) ctx.fillRect(0, (k + scroll) * rowH - gw / 2, W, gw);

  // odłamki lecą za kafelkami, żeby nie zasłaniały kolejnych
  for (const s of shards) {
    const k = 1 - s.t / SHARD_T;
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.globalAlpha = k * k;
    ctx.fillStyle = s.fill;
    ctx.beginPath(); ctx.moveTo(s.p[0], s.p[1]); ctx.lineTo(s.p[2], s.p[3]); ctx.lineTo(s.p[4], s.p[5]); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // kafelki
  for (const r of rows) {
    if (r.y >= ROWS || r.y <= -1) continue;
    for (const t of r.tiles) {
      if (t.st === 1 || t.col >= S.cols) continue;
      if (t.st === 2) {
        ctx.globalAlpha = reduceMotion ? 1 : 0.72 + 0.28 * Math.cos(t.t * 22);
        drawGlazed(tileBox(r.y, t.col), K.bad, 3, 'rgba(255,255,255,0.92)');   // przepadł: cynober i krzyżyk
        ctx.globalAlpha = 1;
      } else drawGlazed(tileBox(r.y, t.col), K.glaze, t.m, K.stamp);
    }
  }

  // łuna przy dolnej krawędzi po przepuszczonym kafelku
  if (missGlow > 0.02) {
    const hgt = rowH * 0.8;
    const g = ctx.createLinearGradient(0, H - hgt, 0, H);
    g.addColorStop(0, rgba(C.danger, 0)); g.addColorStop(1, rgba(C.danger, 0.6 * missGlow));
    ctx.fillStyle = g; ctx.fillRect(0, H - hgt, W, hgt);
  }
  ctx.restore();

  if (state === 'countdown') drawCountdown();
}

/* ---------- przebieg gry ---------- */
function startGame() {
  clampSettings();
  resetField(false);
  score = 0; misses = 0; lives = S.lives; lastLoss = 'miss';
  colW = W / S.cols;
  scoreEl.textContent = '0'; renderLives();
  hideOverlay();
  countdown = 3; setState('countdown');
}
function pauseGame() {
  if (state !== 'playing' && state !== 'countdown') return;
  setState('paused'); showOverlay('pause');
}
function resumeGame() {
  if (state !== 'paused') return;
  hideOverlay();
  countdown = 2; setState('countdown');
}
function toMenu() { resetField(true); setState('menu'); showOverlay('start'); }
function endGame() {
  const prev = getBest(), record = score > prev;
  if (record) store.set(bestKey(), String(score));
  lastResult = { score, best: Math.max(prev, score), record, why: lastLoss };
  resetField(true); setState('menu'); showOverlay('over');
}

function renderLives() {
  livesEl.textContent = '';
  if (S.lives === 0) { livesEl.textContent = '∞'; livesEl.setAttribute('aria-label', 'Życia bez limitu'); return; }
  for (let i = 0; i < S.lives; i++) {
    const s = document.createElement('span');
    s.className = i < lives ? 'life' : 'life lost';
    livesEl.appendChild(s);
  }
  livesEl.setAttribute('aria-label', 'Życia: ' + lives + ' z ' + S.lives);
}

/* ---------- tabliczka ---------- */
const TITLES = { start: 'KAFELKI', pause: 'PAUZA', over: 'KONIEC GRY' };
const PRIMARY = { start: 'Graj', pause: 'Wznów', over: 'Jeszcze raz' };

function setTitle(text) {
  titleEl.textContent = '';
  titleEl.setAttribute('aria-label', text.charAt(0) + text.slice(1).toLowerCase());
  let i = 0;
  for (const ch of text) {
    const s = document.createElement('span');
    s.setAttribute('aria-hidden', 'true');
    if (ch === ' ') s.className = 'sp'; else { s.textContent = ch; s.style.setProperty('--i', String(i++)); }
    titleEl.appendChild(s);
  }
  sizeTitle();
}
function sizeTitle() {
  const kids = titleEl.children;
  if (!kids.length) return;
  let units = 0;
  for (const k of kids) units += k.className === 'sp' ? 0.45 : 1;
  const avail = titleEl.clientWidth - (kids.length - 1) * 4;
  if (avail <= 0) return;
  titleEl.style.setProperty('--tw', Math.max(14, Math.min(46, Math.floor(avail / units * 10) / 10)) + 'px');
}

function stat(name, v) {
  $('#stat' + name).hidden = v === null;
  if (v !== null) $('#ov' + name).textContent = String(v);
}
function renderOverlay() {
  const mode = overlay.dataset.mode;
  noteEl.hidden = true; statsEl.hidden = true;
  if (mode === 'start') {
    subEl.textContent = 'Klikaj kafelki, zanim dotkną dołu ekranu. Możesz grać kilkoma palcami naraz.';
    const best = S.lives === 0 ? 0 : getBest();
    if (best > 0) { noteEl.textContent = 'Rekord przy tych ustawieniach: ' + best; noteEl.hidden = false; }
  } else if (mode === 'pause') {
    subEl.textContent = 'Prędkość, liczbę i kolor kafelków możesz zmienić w trakcie gry.';
    stat('Score', score); stat('Best', null); stat('Miss', S.lives === 0 ? misses : null);
    statsEl.hidden = false;
  } else if (lastResult) {
    subEl.textContent = (lastResult.why === 'tap' ? 'Ostatnie kliknięcie trafiło w pustą ścianę.' : 'Kafelek dotknął dołu ekranu.')
      + (lastResult.record ? ' Nowy rekord przy tych ustawieniach.' : '');
    stat('Score', lastResult.score); stat('Best', lastResult.best); stat('Miss', null);
    statsEl.hidden = false;
  }
}
function showOverlay(mode) {
  overlay.dataset.mode = mode;
  setTitle(TITLES[mode]);
  primaryBtn.textContent = PRIMARY[mode];
  secondaryBtn.hidden = mode !== 'pause';
  renderOverlay();
  $('#settings').scrollTop = 0;
  overlay.classList.add('show');
  sizeTitle();
  if (mode !== 'start') primaryBtn.focus({ preventScroll: true });
}
function hideOverlay() {
  overlay.classList.remove('show');
  const a = document.activeElement;
  if (a && overlay.contains(a)) a.blur();
}

function chips(el, name, items, value, pick) {
  el.textContent = '';
  for (const it of items) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.id = name + '-' + it.value; b.textContent = it.label;
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', it.value === value ? 'true' : 'false');
    if (it.aria) b.setAttribute('aria-label', it.aria);
    b.addEventListener('click', () => pick(it.value));
    el.appendChild(b);
  }
}
function swatches() {
  const el = $('#colorSwatches');
  el.textContent = '';
  for (const c of COLORS) {
    const rgb = tileRgb(c, c.wall || themeTone);   // próbka pokazuje kolor taki, jaki będzie na ścianie
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'swatch'; b.id = 'color-' + c.id;
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', c.id === S.color ? 'true' : 'false');
    b.setAttribute('aria-label', c.name);
    b.style.setProperty('--sw', rgba(rgb, 1));
    b.style.setProperty('--sw-on', lum(rgb) > 0.36 ? rgba(DARK, 1) : '#ffffff');
    b.addEventListener('click', () => { S.color = c.id; changed(false); });
    el.appendChild(b);
  }
  $('#colorOut').textContent = colorDef().name;
}
const numbers = (a, z) => Array.from({ length: z - a + 1 }, (_, i) => ({ value: a + i, label: String(a + i) }));

function renderControls() {
  const activeId = document.activeElement ? document.activeElement.id : '';
  speedEl.value = String(S.speed);
  speedEl.style.setProperty('--pct', ((S.speed - SPEED_MIN) / (SPEED_MAX - SPEED_MIN) * 100).toFixed(1) + '%');
  speedOut.innerHTML = fmt(S.speed) + ' <small>rzędu/s</small>';
  perRowOut.textContent = S.perRow === 1 ? '1' : (S.exact ? 'po ' : 'do ') + S.perRow;
  chips($('#perRowChips'), 'perRow', numbers(1, S.cols), S.perRow, (v) => { S.perRow = v; changed(true); });
  swatches();
  chips($('#colsChips'), 'cols', numbers(COLS_MIN, COLS_MAX), S.cols, (v) => { S.cols = v; changed(true); });
  chips($('#livesChips'), 'lives', LIVES.map((v) => ({ value: v, label: v ? String(v) : '∞', aria: v ? '' : 'bez limitu' })), S.lives, (v) => { S.lives = v; changed(false); });
  $('#penalty').checked = S.penalty;
  $('#exact').checked = S.exact;
  if (activeId) { const el = document.getElementById(activeId); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}
function changed(newField) {
  clampSettings(); saveSettings(); readTheme();
  colW = W / S.cols;
  if (newField && state === 'menu') resetField(true);
  renderControls(); renderOverlay();
}

speedEl.addEventListener('input', () => { S.speed = Number(speedEl.value); changed(false); });
$('#speedDown').addEventListener('click', () => { S.speed -= 1 / SPEED_DIV; changed(false); });
$('#speedUp').addEventListener('click', () => { S.speed += 1 / SPEED_DIV; changed(false); });
$('#penalty').addEventListener('change', (e) => { S.penalty = e.target.checked; changed(false); });
$('#exact').addEventListener('change', (e) => { S.exact = e.target.checked; changed(true); });
primaryBtn.addEventListener('click', () => { if (overlay.dataset.mode === 'pause') resumeGame(); else startGame(); });
secondaryBtn.addEventListener('click', toMenu);
pauseBtn.addEventListener('click', pauseGame);

/* pełny ekran: tylko tam, gdzie przeglądarka na to pozwala */
if (document.fullscreenEnabled && root.requestFullscreen) {
  fsBtn.hidden = false;
  fsBtn.addEventListener('click', () => {
    try {
      const p = document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen();
      if (p && p.catch) p.catch(() => { fsBtn.hidden = true; });
    } catch (e) { fsBtn.hidden = true; }
  });
  document.addEventListener('fullscreenchange', () => {
    fsBtn.setAttribute('aria-label', document.fullscreenElement ? 'Zamknij pełny ekran' : 'Pełny ekran');
  });
}

/* ---------- dotyk, klawiatura, okno ---------- */
canvas.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  tap(e.clientX - r.left, e.clientY - r.top);
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' && e.key !== 'p' && e.key !== 'P') return;
  if (state === 'paused') resumeGame(); else pauseGame();
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('resize', layout);
if ('ResizeObserver' in window) new ResizeObserver(layout).observe(app);
if ('MutationObserver' in window) new MutationObserver(themeChanged).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChanged); } catch (e) {}

/* ---------- start ---------- */
let last = 0;
function frame(now) {
  const dt = last ? Math.min(0.05, Math.max(0, (now - last) / 1000)) : 0;
  last = now;
  tick(dt); draw();
  requestAnimationFrame(frame);
}

function boot(data) {
  loadSettings();
  if (data && data.S) adopt(data.S);
  readTheme(); layout(); renderControls();
  const resume = !!(data && data.inGame) && (S.lives === 0 || data.lives > 0);
  if (resume) {
    // po odświeżeniu strony gra wraca jako pauza z zachowanym wynikiem
    score = Math.max(0, data.score | 0); misses = Math.max(0, data.misses | 0);
    lives = S.lives === 0 ? 0 : Math.min(S.lives, data.lives | 0);
    resetField(false);
    scoreEl.textContent = String(score); renderLives();
    setState('paused'); showOverlay('pause');
  } else {
    resetField(true); setState('menu'); showOverlay('start');
  }
  requestAnimationFrame(frame);
}

window.claude?.hot?.snapshot?.(() => ({
  S: { ...S }, score, lives, misses,
  inGame: state === 'playing' || state === 'countdown' || state === 'paused'
}));
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
